name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Aligné sur PySpark 3.5.x (requirements-local.txt)
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 17 (requis par PySpark local)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-local.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # requirements-local = dotenv/yaml + pyspark + delta-spark + pytest
          pip install -r requirements-local.txt
          pip install flake8

      - name: Lint (flake8)
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,__intit__.py

      - name: Tests unitaires (pytest)
        env:
          # Imports `from src....` depuis la racine du repo
          PYTHONPATH: ${{ github.workspace }}
          # Réduit le bruit Spark dans les logs CI
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          pytest tests/ \
            --maxfail=1 \
            --disable-warnings \
            -q \
            --tb=short
