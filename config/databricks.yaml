# Configuration Databricks — adapter catalog, volumes et cluster.
#
# Unity Catalog : /Volumes/<catalog>/<schema>/<volume>/...
# Chaque segment après le nom de volume est un DOSSIER dans ce volume,
# pas un volume séparé. Seul "raw" doit exister ; bronze/silver/gold
# sont créés automatiquement à l'écriture Delta.
#
# Alternative : créer 3 volumes dédiés (voir scripts/databricks_volumes.sql)
#   bronze: "/Volumes/main/default/bronze"
#   silver: "/Volumes/main/default/silver"
#   gold:   "/Volumes/main/default/gold"

runtime: databricks

paths:
  raw: "/Volumes/main/default/raw/Online_Retail.csv"
  bronze: "/Volumes/main/default/raw/bronze"
  silver: "/Volumes/main/default/raw/silver"
  gold: "/Volumes/main/default/raw/gold"

# Tables Unity Catalog
tables:
  catalog: main
  schema: default
  base: "/Volumes/main/default/raw/tables"

spark:
  app_name: "OnlineRetail-databricks"
  # Compte étudiant / sans cluster : laisser cluster_id vide, serverless: true
  cluster_id: ""
  serverless: true
