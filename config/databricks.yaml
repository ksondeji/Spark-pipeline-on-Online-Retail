# Configuration Databricks — adapter catalog, volumes et cluster.

runtime: databricks

paths:
  raw: "/Volumes/main/default/raw/Online_Retail.csv"
  bronze: "/Volumes/main/default/bronze"
  silver: "/Volumes/main/default/silver"
  gold: "/Volumes/main/default/gold"

spark:
  app_name: "OnlineRetail-databricks"
  # Obligatoire pour : python -m src.main (terminal / job hors notebook)
  # Compute → votre cluster → URL : .../clusters/XXXXXXXX/...
  cluster_id: ""   # ex. "0123-456789-abcdef"
  # Ou true si vous utilisez Serverless (pas de cluster_id)
  serverless: false
